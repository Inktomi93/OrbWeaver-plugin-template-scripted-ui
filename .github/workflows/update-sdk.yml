name: update-sdk

# Moves the SDK and toolchain to the newest plugin-authoring release of Orbweaver, then checks and pushes.
# Runs only in the canonical template repositories: a repository made with "Use this template" inherits this
# file, and it must not change someone else's plugin on its own.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.repository_owner == 'Inktomi93'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: Inktomi93/OrbWeaver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find the newest release
        id: release
        run: |
          latest=$(gh release list --repo "$UPSTREAM" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("plugin-authoring-v"))][0].tagName')
          current=$(jq -r '.devDependencies["@orb/plugin-sdk"] | capture("/download/(?<tag>[^/]+)/").tag' package.json)
          echo "latest=$latest current=$current"
          if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
            echo "version=${latest#plugin-authoring-v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.release.outputs.tag != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.tag != ''
        with:
          node-version: 26
      - name: Update, check and push
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          base="https://github.com/$UPSTREAM/releases/download/$TAG"
          jq --arg sdk "$base/orb-plugin-sdk-$VERSION.tgz" --arg toolchain "$base/orb-plugin-toolchain-$VERSION.tgz" \
            '.devDependencies["@orb/plugin-sdk"] = $sdk | .devDependencies["@orb/plugin-toolchain"] = $toolchain' \
            package.json > package.json.next
          mv package.json.next package.json
          pnpm install --no-frozen-lockfile
          pnpm build
          pnpm check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(authoring): use plugin SDK and toolchain $VERSION"
          git push
