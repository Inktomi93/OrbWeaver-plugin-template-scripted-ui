name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the published authoring lockfile
        run: |
          test -f pnpm-lock.yaml || {
            echo "::error::Publish the plugin-authoring-v0.1.0 SDK and toolchain assets, then generate and commit pnpm-lock.yaml."
            exit 1
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
